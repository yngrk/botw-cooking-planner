server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative so they survive a proxy / published port.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Content-hashed Vite bundles never change → cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Ingredient icons keep stable filenames across deploys → moderate cache.
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # PWA plumbing must always be revalidated, or installed apps never see a new
    # deploy: the service worker, its registration script and the manifest.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # nginx's mime.types has no entry for .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Single-page app: serve the file, else fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML itself should always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
